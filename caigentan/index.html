<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>菜根谭职场修行记</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+XiaoWei&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a single game column; home = the office tower (8 floors = 8 units of the book), play = memo card + red seal verdict + quote scroll */
:root{
  --bg:#E9EEEA; --paper:#F8FAF7; --ink:#18241D; --muted:#5E6E64; --line:#CBD6CE;
  --jade:#2C6A4D; --jade-soft:#D6E6DC; --seal:#BF3A22; --seal-soft:#F5DDD6; --gold:#9A7A2A;
  --f-display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
  --f-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --paper:#17211B; --ink:#E4ECE6; --muted:#93A59A; --line:#2B3A31;
  --jade:#74B894; --jade-soft:#1E3328; --seal:#E5654C; --seal-soft:#3A1F19; --gold:#D2B060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --paper:#17211B; --ink:#E4ECE6; --muted:#93A59A; --line:#2B3A31;
  --jade:#74B894; --jade-soft:#1E3328; --seal:#E5654C; --seal-soft:#3A1F19; --gold:#D2B060; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:0 48px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;
  padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;min-width:0}
.brand-seal{width:34px;height:34px;flex:none;border:2px solid var(--seal);color:var(--seal);border-radius:4px;display:grid;place-items:center;
  font-family:var(--f-brush);font-size:20px;line-height:1}
.brand-name{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip b{font-family:var(--f-mono);font-weight:700;color:var(--seal)}
.lang{display:flex;border:1px solid var(--jade);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 11px;font-size:13px;font-weight:500;color:var(--jade)}
.lang button[aria-pressed="true"]{background:var(--jade);color:var(--paper)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.stat-name{font-family:var(--f-display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-val{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.meter{height:5px;background:var(--jade-soft);border-radius:3px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--jade);border-radius:3px;transition:width .6s ease}
.delta{font-family:var(--f-mono);font-size:12px;font-weight:700}
.delta.pos{color:var(--jade)} .delta.neg{color:var(--seal)}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:28px 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--jade);font-weight:700}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,6vw,46px);line-height:1.15;margin:.2em 0 .3em;text-wrap:balance}
.lede{color:var(--muted);max-width:34em;margin:0}
.hero-quote{font-family:var(--f-brush);writing-mode:vertical-rl;font-size:22px;line-height:1.5;color:var(--seal);border-left:1px solid var(--line);padding-left:14px;height:170px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.how div{border-top:2px solid var(--ink);padding-top:8px;font-size:13px;color:var(--muted);min-width:0}
.how b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}

/* tower */
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:32px;gap:12px}
.section-h h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.section-h span{font-size:13px;color:var(--muted)}
.tower{margin-top:12px;border:2px solid var(--ink);border-radius:var(--r) var(--r) 0 0;background:var(--paper);overflow:hidden}
.roof{display:flex;justify-content:center;padding:8px;border-bottom:2px solid var(--ink);font-family:var(--f-display);letter-spacing:.3em;font-size:14px;background:var(--jade-soft)}
.floor{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.floor:last-child{border-bottom:0}
.floor:not(:disabled):hover{background:var(--jade-soft)}
.floor:disabled{cursor:not-allowed}
.floor-no{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--jade)}
.floor:disabled .floor-no,.floor:disabled .floor-title{color:var(--muted)}
.floor-body{min-width:0}
.floor-title{font-family:var(--f-display);font-size:18px;display:block}
.floor-sub{font-size:13px;color:var(--muted);display:block}
.floor-state{font-size:12px;border-radius:3px;padding:2px 8px;white-space:nowrap}
.st-done{border:1.5px solid var(--seal);color:var(--seal);font-weight:700}
.st-open{background:var(--jade);color:var(--paper)}
.st-lock{color:var(--muted);border:1px dashed var(--line)}
.ground{height:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 10px);opacity:.5}
.home-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:var(--r);padding:9px 18px;font-weight:500}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn:hover{filter:brightness(1.06)}

/* play */
.progress{display:flex;align-items:center;gap:10px;margin-top:22px;font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--jade)}
.dots i.cur{background:var(--ink)}
.memo{position:relative;margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;overflow:hidden}
.memo-head{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:14px}
.memo-q{font-size:17px;line-height:1.75;margin:0;padding-right:4px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 14px;transition:border-color .15s,background .15s}
.opt:not(:disabled):hover{border-color:var(--jade)}
.opt:disabled{cursor:default}
.opt-k{font-family:var(--f-mono);font-weight:700;color:var(--jade)}
.opt.picked{border-color:var(--ink);background:var(--paper)}
.opt.dim{opacity:.5}
.opt-g{display:inline-block;font-size:11px;margin-left:8px;padding:0 6px;border-radius:3px;vertical-align:1px}
.g-up{background:var(--jade);color:var(--paper)} .g-mid{background:var(--gold);color:var(--paper)} .g-low{background:var(--seal);color:var(--paper)}
.stamp{position:absolute;top:14px;right:16px;width:84px;height:84px;border:3px solid var(--seal);color:var(--seal);border-radius:8px;
  display:grid;place-items:center;font-family:var(--f-brush);font-size:30px;line-height:1;transform:rotate(-12deg);opacity:0;pointer-events:none;
  background:color-mix(in srgb,var(--paper) 70%,transparent)}
.stamp.show{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.mid{border-color:var(--gold);color:var(--gold)} .stamp.up{border-color:var(--seal);color:var(--seal)} .stamp.low{border-color:var(--muted);color:var(--muted)}
@keyframes stamp{0%{opacity:0;transform:rotate(-12deg) scale(2.2)}100%{opacity:.92;transform:rotate(-12deg) scale(1)}}
.feedback{margin-top:16px;padding:12px 14px;border-left:3px solid var(--ink);background:var(--bg);font-size:14px}
.feedback .deltas{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}

.scroll{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);display:grid;grid-template-columns:auto 1fr;overflow:hidden}
.scroll-tag{writing-mode:vertical-rl;background:var(--seal);color:var(--paper);font-family:var(--f-display);font-size:15px;letter-spacing:.25em;padding:14px 7px;text-align:center}
.scroll-body{padding:16px 18px;min-width:0}
.classic{font-family:var(--f-brush);font-size:22px;line-height:1.65;margin:0;color:var(--ink)}
.trans{font-style:italic;color:var(--muted);margin:8px 0 0;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font-size:14px}
.kv dt{font-weight:700;color:var(--jade);white-space:nowrap}
.kv dd{margin:0;min-width:0}
.next-row{display:flex;justify-content:flex-end;margin-top:16px}

/* quiz */
.quiz-head{font-family:var(--f-brush);font-size:26px;line-height:1.6;margin:6px 0 4px}
.quiz-blank{display:inline-block;min-width:6em;border-bottom:2px solid var(--seal);color:var(--seal)}
.qopt{font-family:var(--f-brush);font-size:20px}

/* chapter end + ending */
.center{text-align:center}
.big-seal{width:120px;height:120px;margin:28px auto 8px;border:4px solid var(--seal);border-radius:10px;color:var(--seal);display:grid;place-items:center;
  font-family:var(--f-brush);font-size:44px;transform:rotate(-8deg)}
.summary-list{display:grid;gap:8px;margin:18px 0;text-align:left}
.summary-list div{display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:14px}
.summary-list .classic{font-size:17px}
.rank{font-family:var(--f-display);font-size:clamp(30px,7vw,44px);margin:6px 0}
.persona{display:inline-block;margin-top:4px;border:1.5px solid var(--jade);color:var(--jade);border-radius:999px;padding:2px 14px;font-size:14px}

/* collection */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0;display:flex;flex-direction:column;gap:6px}
.card.locked{background:transparent;border-style:dashed;color:var(--muted)}
.card-top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .classic{font-size:18px;line-height:1.55}
.card .trans{font-size:12.5px;margin:0}
.card-lock{font-family:var(--f-brush);font-size:30px;opacity:.35;text-align:center;padding:10px 0}
.foot{margin-top:40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

@media (max-width:560px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
  .hero-quote{writing-mode:horizontal-tb;height:auto;border-left:0;border-top:1px solid var(--line);padding:10px 0 0;font-size:19px}
  .how{grid-template-columns:1fr}
  .brand-name{font-size:16px}
  .chip span{display:none}
  .stamp{width:64px;height:64px;font-size:23px;top:10px;right:10px}
  .memo-q{padding-right:0}
  .classic{font-size:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.stamp.show{opacity:.92}}
</style>

<div class="wrap">
  <header class="bar">
    <button class="brand" id="homeBtn" type="button" aria-label="Home">
      <span class="brand-seal" aria-hidden="true">菜</span>
      <span class="brand-name" data-i="appName"></span>
    </button>
    <div class="bar-right">
      <button class="chip" id="cardsBtn" type="button"><span data-i="bag"></span><b id="cardCount">0</b></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lzh" aria-pressed="true">中</button>
        <button type="button" id="len" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <div class="stats" id="stats"></div>
  <main id="view"></main>
  <p class="foot" data-i="foot"></p>
</div>

      f:{zh:"两个月后，你做的分析成了组里的模板。没人追得上你的门槛。",en:"Two months later your analysis became the team template. Nobody could easily match it."}},
     {t:{zh:"反正比不过，干脆躺平",en:"You can't compete anyway. Coast."},g:"low",d:{z:-3,j:1},
      f:{zh:"轻松了几周，转正评估时却没什么可写。",en:"A few easy weeks, then nothing to show at your review."}}],
  c:"伏久者飞必高，开先者谢必早。知此可以免蹭蹬之忧，可以消躁急之念。",
  e:"The bird that waits longest flies highest; the flower that opens first falls first. Know this, and you stop fearing setbacks and stop rushing.",
  m:{zh:"准备越久，起点越高；急着出头的，也最快被取代。",en:"The longer you prepare, the higher you start. Those who rush to the front are replaced first."},
  u:{zh:"新人先把专业门槛练高，让别人很难超越，再出手。",en:"Build a skill level others can't easily match before you seek the spotlight."}},
 {q:{zh:"主管把一个没人愿接的烂摊子交给你：时间紧，前任留下一堆没文档的代码和不满的客户。",
     en:"Your manager hands you the project nobody wants: tight deadline, undocumented code from your predecessor, and an unhappy client."},
  o:[{t:{zh:"找个理由推掉，等个好项目",en:"Find an excuse and wait for a better project."},g:"low",d:{z:-2,h:-1},
      f:{zh:"主管没说什么，但下次有机会时也没想起你。",en:"Your manager said nothing, and didn't think of you next time either."}},
     {t:{zh:"接下，当成练兵场，边理问题边记文档",en:"Take it as training ground: fix issues and write docs as you go."},g:"up",d:{z:3,d:1,j:1},
      f:{zh:"项目磕磕绊绊交付了，你也成了组里最懂这套系统的人。",en:"It shipped, bumpily, and you became the person who knows that system best."}},
     {t:{zh:"接下，但逢人就抱怨前任挖坑",en:"Take it, but complain about your predecessor to everyone."},g:"mid",d:{z:1,h:-2,j:-1},
      f:{zh:"活干完了，可大家记住的是你的牢骚。",en:"The work got done, but people remember the complaining."}}],
  c:"横逆困穷，是锻炼豪杰的一副炉锤。能受其锻炼者，则身心交益；不受其锻炼者，则身心交困。",
  e:"Adversity and hardship are the furnace and hammer that forge heroes. Accept the forging and body and mind both gain; refuse it and both suffer.",
  m:{zh:"困境是锻造人的熔炉，扛得住就成长，扛不住就受困。",en:"Hard times are a forge. Endure them and you grow; avoid them and you stay stuck."},
  u:{zh:"别人不愿接的难活，往往是新人最快的成长通道。",en:"The hard jobs others avoid are often a newcomer's fastest route to growth."}},
 {q:{zh:"季度复盘会上，资深同事老李当众指出你方案里的三处漏洞，话说得很直，你脸上有点挂不住。",
     en:"At the quarterly review, senior colleague Li bluntly points out three holes in your proposal in front of everyone. Your face burns."},
  o:[{t:{zh:"当场逐条反驳，不能输了气势",en:"Rebut every point on the spot. Don't lose face."},g:"low",d:{h:-2,j:-2},
      f:{zh:"争赢了一条，输了两条，会议室气氛很僵。",en:"You won one point, lost two, and the room went cold."}},
     {t:{zh:"认真记下，会后带着改好的版本去请教老李",en:"Take notes, then bring a revised version to Li afterwards and ask for advice."},g:"up",d:{z:1,h:2,j:2},
      f:{zh:"老李愣了一下，然后花了半小时帮你改。从此他成了你的“编外导师”。",en:"Li was surprised, then spent half an hour helping. He became your unofficial mentor."}},
     {t:{zh:"嘴上说谢谢，心里记下这笔账",en:"Say thanks out loud, hold a grudge inside."},g:"mid",d:{h:-1,j:-2},
      f:{zh:"表面平静，可接下来一周你都在生闷气，效率很低。",en:"Calm on the surface, but you stewed for a week and got little done."}}],
  c:"耳中常闻逆耳之言，心中常有拂心之事，才是进德修行的砥石。若言言悦耳，事事快心，便把此生埋在鸩毒中矣。",
  e:"Hard words in your ears and frustrations in your heart are the whetstone of character. If every word pleases and every day delights, you bury your life in poison.",
  m:{zh:"刺耳的话、不顺心的事，才是磨砺自己的磨刀石。",en:"Harsh feedback and setbacks are what sharpen you."},
  u:{zh:"把当众批评当成免费咨询；只听好话的人进步最慢。",en:"Treat public criticism as free consulting. People who only hear praise improve slowest."}}],
 quiz:{h:"宠利毋居人前，",a:"德业毋落人后",w:["名声必争人先","苦劳莫揽己身"],
  e:"Don't stand ahead of others for favor and profit; don't fall behind others in virtue and work."}},

{floor:2,unit:{zh:"分辨善恶",en:"Telling Right from Wrong"},stage:{zh:"第一个项目",en:"First Project"},
 scenes:[
 {q:{zh:"你负责一次采购比价。一家供应商私下暗示：只要把他们的报价“调一调”，年底有份“心意”。",
     en:"You're running a vendor comparison. One supplier hints that if you 'adjust' their quote a little, there'll be a 'thank-you' at year end."},
  o:[{t:{zh:"收下，反正没人知道",en:"Accept. Nobody will know."},g:"low",d:{d:-4,j:-2},
      f:{zh:"之后每次审计，你都睡不好觉。",en:"Every audit since, you've slept badly."}},
     {t:{zh:"钱不收，但人情卖一点，稍微倾斜",en:"Refuse the money, but tilt things their way a bit."},g:"mid",d:{d:-1,h:1},
      f:{zh:"你以为两全其美，对方却把这当成了“可以谈”的信号。",en:"You thought it was a compromise. They took it as a sign you're negotiable."}},
     {t:{zh:"礼貌拒绝，按流程公开比价，并留存记录",en:"Politely decline, run the open comparison, and keep records."},g:"up",d:{d:3,z:1,j:1},
      f:{zh:"供应商碰了软钉子，反而对你更尊重。",en:"The supplier backed off and respected you more for it."}}],
  c:"当是非邪正之交，不可稍迁就，稍迁就则失从违之准；值利害得失之会，不可太分明，太分明则起趋避之私。",
  e:"Where right meets wrong, don't bend an inch, or you lose your compass. Where gain meets loss, don't calculate too sharply, or selfishness creeps in.",
  m:{zh:"是非原则寸步不让；个人得失不必算得太精。",en:"On right and wrong, don't yield. On personal gain and loss, don't count too closely."},
  u:{zh:"碰到红线问题，第一次就要说“不”，模糊处理只会招来下一次。",en:"Say no the first time someone tests a red line. Being vague invites a second attempt."}},
 {q:{zh:"周末你主动加班，帮隔壁组修好了一个线上故障。周一早上，你在想要不要在大群里“顺便提一下”。",
     en:"You spent your weekend fixing another team's production outage. Monday morning you wonder whether to 'casually mention' it in the big group chat."},
  o:[{t:{zh:"发一篇长文，详述自己如何力挽狂澜",en:"Post a long write-up on how you saved the day."},g:"low",d:{h:-2,d:-1},
      f:{zh:"点赞不少，隔壁组组长的脸色却不太好看。",en:"Plenty of likes, but the other team's lead looked uncomfortable."}},
     {t:{zh:"不表功，只在故障文档里写清原因和修复方式",en:"Don't boast. Just document the cause and fix in the incident report."},g:"up",d:{d:2,h:2},
      f:{zh:"隔壁组长看到文档，专门来道谢，还在月会上提了你。",en:"The other lead read the report, thanked you personally, and mentioned you at the monthly meeting."}},
     {t:{zh:"午饭时跟老板“不经意”提起",en:"Bring it up 'casually' with the boss at lunch."},g:"mid",d:{h:1,d:-1},
      f:{zh:"老板点点头。这招管用一次，用多了就不灵了。",en:"The boss nodded. It works once; overused, it stops working."}}],
  c:"为恶而畏人知，恶中犹有善念；为善而急人知，善处即是恶根。",
  e:"Doing wrong but fearing exposure: some good remains in that wrong. Doing good but rushing to be seen: that good becomes the root of wrong.",
  m:{zh:"做了好事急着让人知道，好事里就藏了私心。",en:"Rushing to advertise a good deed plants selfishness inside it."},
  u:{zh:"让成果替你说话。文档、数据比自夸更有分量。",en:"Let the results speak. A clear write-up carries more weight than self-promotion."}},
 {q:{zh:"报销时同事凑过来：“打车票多贴几张，大家都这么干。”金额不过几十块。",
     en:"Doing expenses, a colleague leans over: 'Add a few extra taxi receipts, everyone does it.' It's only a few dollars."},
  o:[{t:{zh:"跟着贴，小钱而已",en:"Go along. It's small money."},g:"low",d:{d:-3},
      f:{zh:"小口子一开，后面每次都会想“再多一点也无妨”。",en:"Once the small door opens, every next time feels like 'a bit more is fine.'"}},
     {t:{zh:"照实报销，笑着说自己记性不好怕对不上账",en:"File it accurately, and joke that you'd never keep the extra receipts straight."},g:"up",d:{d:3,h:1},
      f:{zh:"既守住了底线，也没让同事难堪。",en:"You kept your line without embarrassing anyone."}},
     {t:{zh:"少贴一两张，意思一下",en:"Add just one or two, to blend in."},g:"low",d:{d:-2,h:1},
      f:{zh:"你以为折中，其实已经越线。",en:"It felt like a middle path. It was already over the line."}}],
  c:"尘许旃檀彻底香，勿以微善而起略退之念；毫端鸩血同鸩毒，莫以细恶而萌无伤之芽。",
  e:"A speck of sandalwood perfumes the whole room, so don't shrink from small good. A drop of poison is still poison, so don't let a small wrong sprout.",
  m:{zh:"勿以善小而不为，勿以恶小而为之。",en:"Don't skip a good deed because it's small; don't do a wrong because it's small."},
  u:{zh:"职业信用是一点点攒的，也是一点点漏的。",en:"Professional trust is built bit by bit, and lost the same way."}}],
 quiz:{h:"为善不见其益，如草里冬瓜，自能暗长；为恶不见其损，",a:"如庭前之雪，势必潜消",w:["如山中之石，终古不移","如水上之萍，随波而去"],
  e:"Good with no visible reward grows quietly like a melon in the grass; harm with no visible cost melts away like snow in the yard."}},

{floor:3,unit:{zh:"人情练达",en:"Reading People"},stage:{zh:"融入团队",en:"Fitting In"},
 scenes:[
 {q:{zh:"你主导的项目成功上线。庆功会上，老板请你说几句。",en:"Your project launched successfully. At the celebration, the boss asks you to say a few words."},
  o:[{t:{zh:"把功劳分给团队，点名感谢每位协作的同事",en:"Credit the team and thank each collaborator by name."},g:"up",d:{h:3,d:1},
      f:{zh:"散会后，好几个同事主动说下个项目还想跟你合作。",en:"Afterwards several colleagues said they want to work with you again."}},
     {t:{zh:"详细讲讲自己克服了哪些难关",en:"Walk through the obstacles you personally overcame."},g:"low",d:{h:-3},
      f:{zh:"老板很满意，同事们的掌声却有点稀。",en:"The boss was pleased; your colleagues' applause was thin."}},
     {t:{zh:"客套一句“运气好”，赶紧下台",en:"Say 'just lucky' and step down fast."},g:"mid",d:{h:1,j:1},
      f:{zh:"不出错，但错过了凝聚团队的机会。",en:"No harm done, but a missed chance to bring the team together."}}],
  c:"节义之人济以和衷，才不启忿争之路；功名之士承以谦德，方不开嫉妒之门。",
  e:"The principled should temper themselves with harmony, or they open the road to conflict; the successful should carry themselves with humility, or they open the door to envy.",
  m:{zh:"有原则也要和气，有功劳更要谦虚。",en:"Pair principle with warmth, and success with humility."},
  u:{zh:"功劳说出来是“我们”，责任说出来是“我”。",en:"Say 'we' for the wins and 'I' for the misses."}},
 {q:{zh:"新同事一个低级错误，让你做了一天的报表全部要重做。",en:"A new colleague's basic mistake means the report you spent all day on has to be redone."},
  o:[{t:{zh:"在群里@他，把错误截图发出来",en:"Tag them in the group chat with a screenshot of the error."},g:"low",d:{h:-3,j:-1},
      f:{zh:"他当众下不来台，从此见你就躲。",en:"They were humiliated in public and now avoid you."}},
     {t:{zh:"私下告诉他错在哪、下次怎么避免，自己先把报表补上",en:"Tell them privately what went wrong and how to avoid it; fix the report yourself first."},g:"up",d:{h:2,d:1,j:1},
      f:{zh:"他红着脸道谢，之后做事格外仔细。",en:"They thanked you, red-faced, and became much more careful."}},
     {t:{zh:"一声不吭默默重做",en:"Redo it silently and say nothing."},g:"mid",d:{j:1},
      f:{zh:"你忍了，但他不知道错在哪，下次可能再犯。",en:"You kept the peace, but they still don't know what went wrong."}}],
  c:"攻人之恶勿太严，要思其堪受；教人以善勿过高，当使其可从。",
  e:"When criticizing someone's faults, don't be too harsh; consider what they can bear. When teaching good, don't aim too high; make it something they can follow.",
  m:{zh:"指出别人错误要顾及对方承受力；教人要让人做得到。",en:"Correct people in a way they can take, and teach in a way they can follow."},
  u:{zh:"批评私下说，标准具体给，台阶留给对方。",en:"Criticize in private, give concrete standards, and leave them a way to save face."}},
 {q:{zh:"跨部门会议上，你发现对方部门汇报的数据算错了。此刻你可以当场“将军”，让对方下不来台。",
     en:"In a cross-department meeting, you spot a calculation error in the other team's numbers. You could call it out right now and leave them exposed."},
  o:[{t:{zh:"当场揭穿，显示专业",en:"Call it out on the spot to show your expertise."},g:"low",d:{h:-3,z:1},
      f:{zh:"你赢了一局，却多了一个处处卡你流程的部门。",en:"You won the round and gained a department that now blocks your requests."}},
     {t:{zh:"不吭声，等他们自己出事",en:"Stay quiet and let them find out the hard way."},g:"low",d:{d:-2},
      f:{zh:"错误数据流进决策，最后整个项目一起返工。",en:"The bad numbers fed a decision, and the whole project had to be redone."}},
     {t:{zh:"会后私下提醒，附上你的核算",en:"Tell them privately after the meeting, with your calculation attached."},g:"up",d:{h:2,d:1,j:1},
      f:{zh:"对方连声道谢，下次合作时主动给你开了绿灯。",en:"They were grateful and fast-tracked your next request."}}],
  c:"路径窄处，留一步与人行；滋味浓的，减三分让人尝。此皆涉世安乐法也。",
  e:"Where the path is narrow, leave a step for others; when the flavor is rich, save a share for others to taste. This is how to move through the world in peace.",
  m:{zh:"窄路让人一步，好处分人三分，这是处世安乐之道。",en:"Give way on narrow paths and share the good things. That is how to live in peace with others."},
  u:{zh:"指正别人时，选对场合，给足台阶。",en:"When correcting others, pick the right setting and let them keep face."}}],
 quiz:{h:"处世让一分为高，",a:"退步即进步的张本",w:["争先方是立身之本","让人终是吃亏之源"],
  e:"Yielding a little is the higher way; stepping back lays the ground for stepping forward."}},

{floor:4,unit:{zh:"透视人性",en:"Seeing Through People"},stage:{zh:"办公室暗流",en:"Office Undercurrents"},
 scenes:[
 {q:{zh:"一位平时不熟的同事突然对你格外热情：请吃饭、送小礼物。一周后，他请你在审批上“行个方便”。",
     en:"A colleague you barely know suddenly turns warm: lunches, small gifts. A week later, they ask you to 'go easy' on an approval."},
  o:[{t:{zh:"感谢好意，但审批照规矩办",en:"Thank them warmly, but handle the approval by the rules."},g:"up",d:{d:2,j:2},
      f:{zh:"他有点失望，但也明白了你的边界。",en:"They were disappointed, but now they know your boundaries."}},
     {t:{zh:"盛情难却，就帮这一次",en:"Hard to refuse after all that. Just this once."},g:"low",d:{d:-3,h:1},
      f:{zh:"“这一次”后来变成了第二次、第三次。",en:"'Just once' became twice, then three times."}},
     {t:{zh:"当场翻脸，向领导揭发",en:"Confront them and report it to management at once."},g:"mid",d:{d:1,h:-2},
      f:{zh:"原则守住了，但手法太硬，树了个敌人。",en:"You held the line, but the heavy hand made an enemy."}}],
  c:"大恶多从柔处伏，哲士须防棉里针；深仇常自爱中来，达人宜远刀头蜜。",
  e:"Great harm often hides in softness; the wise watch for the needle in the cotton. Deep enmity often grows from affection; the wise keep away from honey on a blade.",
  m:{zh:"最危险的往往藏在过分的热情里。",en:"The greatest danger often hides inside excessive warmth."},
  u:{zh:"无缘无故的好，先想想对方要什么；拒绝时对事不对人。",en:"When kindness comes from nowhere, ask what's wanted. Refuse the request, not the person."}},
 {q:{zh:"你刚升为小组长。一位组员跑来跟你说另一位组员的坏话，说得有鼻子有眼。",en:"You've just become team lead. One member comes to you with a detailed story about another member's failings."},
  o:[{t:{zh:"立刻对那位组员冷淡下来",en:"Immediately turn cold toward the accused."},g:"low",d:{h:-2,d:-1},
      f:{zh:"后来发现，是两人之间有私怨。你成了别人的刀。",en:"It turned out to be a personal feud. You were used as a weapon."}},
     {t:{zh:"认真听，不表态，之后自己观察核实",en:"Listen, take no position, and verify for yourself later."},g:"up",d:{j:3,d:1},
      f:{zh:"你看清了事实，也看清了说坏话的人。",en:"You found the facts, and learned something about the person who told you."}},
     {t:{zh:"把话原样转告给当事人",en:"Pass the story straight on to the person concerned."},g:"low",d:{h:-3},
      f:{zh:"两人当场吵起来，组里乱成一锅粥。",en:"They had a shouting match and the team fell apart for a week."}}],
  c:"闻恶不可就恶，恐为谗夫泄怒；闻喜不可急亲，恐引奸人近身。",
  e:"Hearing ill of someone, don't rush to dislike them; it may be a slanderer venting. Hearing praise, don't rush to embrace them; it may let a schemer near.",
  m:{zh:"听到坏话别急着讨厌，听到好话也别急着亲近。",en:"Don't rush to dislike on bad reports, or to embrace on good ones."},
  u:{zh:"当了管理者，听来的话一律先打个问号，以事实为准。",en:"As a manager, put a question mark on everything you hear second-hand. Go by facts."}},
 {q:{zh:"部门聚餐，几杯酒下肚，有人开始吐槽公司、讲老板八卦，大家起哄让你也说两句。",
     en:"At a team dinner, after a few drinks people start complaining about the company and gossiping about the boss. Everyone urges you to join in."},
  o:[{t:{zh:"跟着吐槽，显得合群",en:"Join in to fit in."},g:"low",d:{j:-2,d:-1,h:1},
      f:{zh:"第二天，你的话以另一个版本传到了老板耳朵里。",en:"The next day, a version of your words reached the boss."}},
     {t:{zh:"严肃制止大家",en:"Sternly tell everyone to stop."},g:"mid",d:{d:1,h:-2},
      f:{zh:"场面冷了下来，你被贴上“无趣”的标签。",en:"The mood died and you got labeled a killjoy."}},
     {t:{zh:"笑着听，不接话，适时把话题引到别处",en:"Smile, don't add anything, and steer the topic elsewhere."},g:"up",d:{j:3,h:1},
      f:{zh:"气氛没冷，你也没留下任何把柄。",en:"The mood stayed warm, and you left nothing anyone could use."}}],
  c:"波浪掀天，舟中不知惧而舟外者寒心；猖狂骂座，席上不知警而席外者咋舌。故君子身虽在事中，心要超事外也。",
  e:"When waves reach the sky, those in the boat feel no fear while those ashore shudder. When someone rants at the table, the guests don't notice while onlookers gasp. Keep your body in the matter and your mind above it.",
  m:{zh:"身在局中容易失去判断，要让心站在局外看。",en:"Inside a situation you lose judgment. Let your mind watch from outside."},
  u:{zh:"饭局、群聊都是“公开场合”，情绪越高，越要冷静。",en:"Dinners and group chats are public. The hotter the mood, the cooler you should be."}}],
 quiz:{h:"当与人同过，不当与人同功，同功则相忌；可与人共难，",a:"不可与人共乐，共乐则相仇",w:["亦可与人共乐，共乐则相亲","不可与人共谋，共谋则相疑"],
  e:"Share faults with others, not credit; shared credit breeds envy. Share hardship, not comfort; shared comfort breeds feud."}},

{floor:5,unit:{zh:"洞察世事",en:"Reading the World"},stage:{zh:"升职风波",en:"Promotion Season"},
 scenes:[
 {q:{zh:"你连续拿下两个大单，风头正劲。有人私下说：“下一任总监非你莫属。”",en:"You've landed two big deals in a row. Someone whispers: 'You're the next director for sure.'"},
  o:[{t:{zh:"趁热去找老板谈升职",en:"Strike while it's hot and ask the boss for a promotion."},g:"mid",d:{z:1,h:-1},
      f:{zh:"老板说“再看看”。你有点失落，但也算表达了意愿。",en:"The boss said 'let's see.' Disappointing, but at least you spoke up."}},
     {t:{zh:"越顺越谨慎：补团队短板，预判下季度风险",en:"Grow more careful as things go well: fix team gaps, plan for next quarter's risks."},g:"up",d:{z:2,j:2,d:1},
      f:{zh:"下季度市场转冷，只有你的团队提前有准备。",en:"The market cooled next quarter, and only your team was ready."}},
     {t:{zh:"开始以总监自居，处处拍板",en:"Start acting like the director already."},g:"low",d:{h:-3,j:-2},
      f:{zh:"几位资深同事联手向老板反映你“太飘了”。",en:"Several senior colleagues told the boss you'd let it go to your head."}}],
  c:"衰飒的景象，就在盛满中；发生的机缄，即在零落内。故君子居安宜操一心以虑患，处变当坚百忍以图立。",
  e:"Decline hides inside abundance; new growth hides inside withering. So in good times keep a mind for danger, and in hard times hold on with patience until you succeed.",
  m:{zh:"盛极之中已藏着衰败，低谷里也孕育着生机。",en:"Decline is already inside the peak, and new life is already inside the low point."},
  u:{zh:"顺风时做风险预案，逆风时咬牙坚持。",en:"Plan for risk in tailwinds; hold steady in headwinds."}},
 {q:{zh:"升职名单公布，没有你。茶水间里有人说你“能力也就那样”。",en:"The promotion list is out and you're not on it. In the pantry, someone says you're 'not that good anyway.'"},
  o:[{t:{zh:"发一条阴阳怪气的朋友圈",en:"Post something passive-aggressive on social media."},g:"low",d:{j:-3,h:-2},
      f:{zh:"截图很快传开，这下真的坐实了“格局小”。",en:"Screenshots spread, and now you really look small."}},
     {t:{zh:"把议论当镜子，找主管复盘差距，定下半年计划",en:"Treat the talk as a mirror: review the gaps with your manager and set a six-month plan."},g:"up",d:{z:3,j:2},
      f:{zh:"半年后，你补齐了短板，主管主动提名了你。",en:"Six months later you'd closed the gaps, and your manager nominated you."}},
     {t:{zh:"立刻投简历，此处不留爷",en:"Send out résumés immediately."},g:"mid",d:{z:-1,j:-1},
      f:{zh:"换了地方，同样的短板还在等你。",en:"New company, same gaps waiting for you."}}],
  c:"毁人者不美，而受人毁者遭一番讪谤，便加一番修省，可以释丑而增美；欺人者非福，而受人欺者遇一番横逆，便长一番器宇，可以转祸而为福。",
  e:"Slanderers are not admirable, but if each slander becomes a chance to reflect, you shed flaws and gain grace. Bullies are not blessed, but if each wrong you endure enlarges your capacity, you turn misfortune into fortune.",
  m:{zh:"被毁谤时反省自己，被欺负时扩大胸襟，就能转祸为福。",en:"Reflect when slandered, grow broader when wronged, and misfortune turns to fortune."},
  u:{zh:"负面评价里也有真实的信息，先取有用的部分。",en:"Even unfair criticism has some truth in it. Take the useful part first."}},
 {q:{zh:"猎头找上门：竞争对手开出三倍薪水，条件是你把现公司的客户资料一起带过去。",
     en:"A headhunter calls: a competitor offers triple your salary, on condition you bring your current company's client data."},
  o:[{t:{zh:"答应，机会难得",en:"Accept. Chances like this are rare."},g:"low",d:{d:-4,j:-1},
      f:{zh:"入职三个月后，你收到了老东家的律师函。",en:"Three months in, your old employer's lawyers sent a letter."}},
     {t:{zh:"先拖着，看看能不能只带一部分",en:"Stall and see if you can bring just some of it."},g:"mid",d:{d:-1,j:-1},
      f:{zh:"犹豫本身就说明你动了心。对方也看出来了。",en:"The hesitation showed you were tempted, and they noticed."}},
     {t:{zh:"直接拒绝：跳槽可以谈，资料免谈",en:"Refuse plainly: happy to talk about a move, never about the data."},g:"up",d:{d:3,j:2},
      f:{zh:"猎头记下了你，半年后带来一个干净的好机会。",en:"The headhunter remembered you and came back with a clean offer six months later."}}],
  c:"非分之福，无故之获，非造物之钓饵，即人世之机阱。此处着眼不高，鲜不堕彼术中矣。",
  e:"Undeserved luck and unearned gains are either heaven's bait or the world's trap. Without a higher view, few avoid falling in.",
  m:{zh:"不该得的好处，不是诱饵就是陷阱。",en:"Gains you haven't earned are either bait or a trap."},
  u:{zh:"天上掉馅饼时，先找鱼钩在哪。",en:"When something too good arrives, look for the hook."}}],
 quiz:{h:"休与小人仇雠，小人自有对头；",a:"莫向君子谄媚，君子原无私惠",w:["须向君子求援，君子自有公道","莫与君子争锋，君子自有靠山"],
  e:"Don't make enemies of petty people; they have their own adversaries. Don't flatter good people; they hand out no private favors."}},

{floor:6,unit:{zh:"境界品味",en:"Character & Taste"},stage:{zh:"成为骨干",en:"Core Member"},
 scenes:[
 {q:{zh:"你成了团队骨干，连续几个月高强度加班，开始焦躁、失眠，对同事说话也冲了起来。",
     en:"You're now a core member. Months of heavy overtime have left you irritable and sleepless, and you've been snapping at colleagues."},
  o:[{t:{zh:"咬牙硬撑，忙完这阵再说",en:"Grit your teeth and push through."},g:"mid",d:{z:1,j:-2,h:-1},
      f:{zh:"活是撑下来了，但你和两位同事闹僵了。",en:"You made it through, and fell out with two colleagues."}},
     {t:{zh:"每天留出固定的静心时段，理清优先级，学会说“不”",en:"Block quiet time daily, sort priorities, and learn to say no."},g:"up",d:{j:3,h:1,z:1},
      f:{zh:"事情没少，但你做得更有条理，脾气也回来了。",en:"Same workload, but more order, and your temper came back."}},
     {t:{zh:"裸辞，先去大理住半年",en:"Quit with nothing lined up and move somewhere quiet for six months."},g:"mid",d:{j:1,z:-2},
      f:{zh:"放松是真的，但回来时发现问题还在原地。",en:"You relaxed, but the underlying problem was still there when you got back."}}],
  c:"性躁心粗者，一事无成；心和气平者，百福自集。",
  e:"The hot-tempered and careless accomplish nothing; the calm and even-tempered gather every blessing.",
  m:{zh:"浮躁的人做不成事，心平气和的人福气自来。",en:"Restlessness ruins work; calm attracts good fortune."},
  u:{zh:"越忙越要稳住情绪，情绪失控的代价远大于多加一晚班。",en:"The busier you are, the more you must steady yourself. Losing your temper costs more than one more late night."}},
 {q:{zh:"项目卡住了：你坚持自己的技术方案，另一个部门坚持他们的，双方僵持了两周。",
     en:"The project is stuck: you insist on your technical approach, another department insists on theirs, and it's been two weeks."},
  o:[{t:{zh:"寸步不让，我的方案就是最优",en:"Don't budge. Your plan is the best."},g:"low",d:{h:-3,z:1},
      f:{zh:"又僵了两周，老板把项目交给了别人。",en:"Two more weeks of deadlock, then the boss gave the project to someone else."}},
     {t:{zh:"守住核心原则，细节上主动调整，找出共同点",en:"Hold the core principle, adjust the details, find common ground."},g:"up",d:{h:2,z:1,j:1},
      f:{zh:"三天后方案落地，两个部门都觉得自己赢了。",en:"Three days later it shipped, and both teams felt they'd won."}},
     {t:{zh:"全盘让步，只求早点推进",en:"Give in completely to get things moving."},g:"mid",d:{h:1,z:-2},
      f:{zh:"推进了，但上线后你的担心全应验了。",en:"It moved, and every concern you had came true after launch."}}],
  c:"建功立业者多圆融之士，偾事失机者必执拗之人。",
  e:"Those who build lasting work are mostly flexible and open-minded; those who ruin chances are always the stubborn.",
  m:{zh:"成事的人多半圆融，坏事的人一定执拗。",en:"People who get things done are mostly flexible; people who ruin them are stubborn."},
  u:{zh:"原则要方，手段要圆。分清“必须坚持”和“可以商量”。",en:"Be square on principle and round on method. Know what's non-negotiable and what's open."}},
 {q:{zh:"你曾自掏腰包资助实习生参加培训。转正后不久，她跳槽去了竞争对手那里。",
     en:"You once paid for an intern's training out of your own pocket. Soon after being hired full-time, she left for a competitor."},
  o:[{t:{zh:"觉得被背叛，跟同事抱怨她不懂感恩",en:"Feel betrayed and complain that she's ungrateful."},g:"low",d:{j:-2,h:-1},
      f:{zh:"话传到她耳朵里，一段好关系彻底断了。",en:"She heard about it, and a good relationship ended for good."}},
     {t:{zh:"帮过就帮过了，真心祝她前程好",en:"You helped because you wanted to. Wish her well."},g:"up",d:{d:2,j:2,h:1},
      f:{zh:"两年后，她成了你最重要的合作伙伴之一。",en:"Two years later she became one of your most valuable partners."}},
     {t:{zh:"委婉暗示她把培训费还上",en:"Hint that she should pay back the training fee."},g:"low",d:{d:-1,h:-2},
      f:{zh:"钱要回来了，情分也就到此为止。",en:"You got the money back, and that was the end of the goodwill."}}],
  c:"施恩者，内不见己，外不见人，即斗粟可当万金之惠；利物者，计己之施，责人之报，虽百镒难成一文之功。",
  e:"If a giver sees neither self nor receiver, a peck of grain is worth a fortune. If a helper counts what was given and demands repayment, even a hundred pieces of gold earn no merit.",
  m:{zh:"帮人不记得自己帮过，一点点也是大恩；斤斤计较回报，再多也不算功德。",en:"Help given without keeping score is great kindness; help that demands a return counts for nothing."},
  u:{zh:"栽培人是投资行业，不是投资个人回报。",en:"When you develop people, you invest in the field, not in a personal return."}}],
 quiz:{h:"醴肥辛甘非真味，真味只是淡；",a:"神奇卓异非至人，至人只是常",w:["声名显赫非真人，真人只是隐","才华横溢方为杰，豪杰必须奇"],
  e:"Rich, spicy and sweet are not true flavor; true flavor is plain. The dazzling are not the highest people; the highest people are ordinary."}},

{floor:7,unit:{zh:"培养福德",en:"Cultivating Goodwill"},stage:{zh:"开始带团队",en:"Leading a Team"},
 scenes:[
 {q:{zh:"你被任命为经理，开始带一支新团队。上任第一个月，你打算怎么立规矩？",en:"You've been named manager of a new team. How do you set the tone in month one?"},
  o:[{t:{zh:"先宽松些拉近关系，出了问题再收紧",en:"Start relaxed to build rapport, tighten up if problems appear."},g:"low",d:{h:1,j:-2},
      f:{zh:"三个月后你开始收紧，大家觉得你“变了”，怨声一片。",en:"When you tightened three months later, everyone said you'd changed and resented it."}},
     {t:{zh:"规则讲清楚、严格执行；之后逐步放权，多给关怀",en:"Set clear rules and enforce them; then gradually loosen and show more care."},g:"up",d:{z:2,h:2},
      f:{zh:"起初有人不适应，半年后团队最服你。",en:"Some found it tough at first. Six months later, they trust you most."}},
     {t:{zh:"一直从严，不讲情面",en:"Stay strict, no exceptions, no warmth."},g:"mid",d:{z:1,h:-2},
      f:{zh:"执行力很强，但没人愿意多走一步。",en:"Strong execution, but nobody goes the extra mile."}}],
  c:"恩宜自淡而浓，先浓而后淡者，人反忘其惠；威宜自严而宽，先宽而后严者，人必怨其酷。",
  e:"Kindness should go from light to rich; start rich and turn light, and people forget it. Authority should go from strict to lenient; start lenient and turn strict, and people resent you.",
  m:{zh:"给好处要由少到多，立威要由严到宽。",en:"Give kindness little by little; set authority strict first, then relax."},
  u:{zh:"新官上任先立规则，再给温度，顺序不能反。",en:"New leaders set rules first and warmth second. Never the other way round."}},
 {q:{zh:"项目出了事故，责任一半在你的决策，一半在下属执行。老板在会上问：怎么回事？",
     en:"A project failed: half your decision, half your report's execution. In the meeting, the boss asks what happened."},
  o:[{t:{zh:"主动认下自己的部分，强调团队已在补救",en:"Own your part first and stress that the team is already fixing it."},g:"up",d:{d:2,h:2,j:1},
      f:{zh:"老板没再追究。会后下属红着眼睛跟你说谢谢。",en:"The boss let it go. Afterwards your report thanked you, close to tears."}},
     {t:{zh:"实话实说：主要是执行出了问题",en:"Tell it 'straight': it was mainly an execution problem."},g:"low",d:{h:-3,d:-1},
      f:{zh:"老板记下了下属的名字，也记下了你不担事。",en:"The boss noted your report's name, and noted that you don't take responsibility."}},
     {t:{zh:"沉默，等老板自己判断",en:"Stay silent and let the boss decide."},g:"mid",d:{j:1,h:-1},
      f:{zh:"没出大错，但团队不确定你会不会护着他们。",en:"No disaster, but your team isn't sure you'll back them."}}],
  c:"完名美节不宜独任，分些与人，可以远害全身；辱行污名不宜全推，引些归己，可以韬光养德。",
  e:"Don't claim full honor alone; share some and you stay safe. Don't push all disgrace away; take some on yourself and you grow in quiet virtue.",
  m:{zh:"好名声分一些给别人，坏名声揽一些给自己。",en:"Share some of the credit; take on some of the blame."},
  u:{zh:"管理者的威信，来自出事时站在团队前面。",en:"A leader's authority comes from standing in front of the team when things go wrong."}},
 {q:{zh:"年终绩效会上，有人建议把一位老员工三年前犯过的错误（早已改正）翻出来，作为不给他晋升的理由。",
     en:"At year-end reviews, someone suggests bringing up a mistake a veteran made three years ago (long since corrected) as a reason to deny his promotion."},
  o:[{t:{zh:"翻出来，有记录就该用",en:"Use it. If it's on record, it counts."},g:"low",d:{d:-2,h:-2},
      f:{zh:"老员工寒了心，团队里人人自危。",en:"The veteran lost heart, and everyone else started worrying about their own past."}},
     {t:{zh:"私下警告他：你的旧账我都知道",en:"Privately let him know you remember his old mistake."},g:"mid",d:{h:-1},
      f:{zh:"他表面服帖，心里从此对你设防。",en:"He complies outwardly, and keeps his guard up with you."}},
     {t:{zh:"不翻旧账，只看今年表现",en:"Leave the past alone; judge this year's work."},g:"up",d:{d:2,h:2},
      f:{zh:"他今年表现确实好，晋升后带出了两个新人。",en:"He'd earned it. After the promotion, he trained two new hires."}}],
  c:"不责人小过，不发人阴私，不念人旧恶，此三者可以养德，亦可以远害。",
  e:"Don't blame small faults, don't expose private matters, don't dwell on old wrongs. These three cultivate virtue and keep harm away.",
  m:{zh:"不抓小错、不揭隐私、不记旧恶，既积德又避祸。",en:"Skip small faults, keep secrets, forget old wrongs. It builds goodwill and avoids trouble."},
  u:{zh:"评价人看现在和趋势，不要拿过去绑住一个人。",en:"Judge people by the present and their direction, not by their past."}}],
 quiz:{h:"争先的径路窄，退后一步自宽平一步；",a:"浓艳的滋味短，清淡一分自悠久一分",w:["浓艳的风光好，抢前一步自多得一分","清淡的日子苦，忍耐一时自好过一时"],
  e:"The road of rushing ahead is narrow; step back and it widens. Rich flavors fade fast; a little plainness lasts a little longer."}},

{floor:8,unit:{zh:"家人相处",en:"Family Matters"},stage:{zh:"工作与家庭",en:"Work & Home"},
 scenes:[
 {q:{zh:"你加班到深夜回家，父母又开始唠叨：“这么累，不如考个公务员稳定点。”你已经很疲惫了。",
     en:"Home after midnight, your parents start again: 'Why not take a stable government job?' You're exhausted."},
  o:[{t:{zh:"顶一句：“你们根本不懂我的工作”",en:"Snap: 'You don't understand my job at all.'"},g:"low",d:{h:-3,j:-2},
      f:{zh:"摔门声之后，是一家人一整周的沉默。",en:"After the slammed door came a week of silence at home."}},
     {t:{zh:"先谢谢他们的关心，周末再平静地聊聊你的规划",en:"Thank them for caring, then talk calmly about your plans at the weekend."},g:"up",d:{h:3,j:2},
      f:{zh:"周末一聊，他们第一次说：“你有想法，我们就放心了。”",en:"At the weekend they said for the first time: 'If you have a plan, we're at ease.'"}},
     {t:{zh:"嗯嗯啊啊敷衍，躲进房间",en:"Mumble along and retreat to your room."},g:"mid",d:{j:1,h:-1},
      f:{zh:"没吵起来，但下次唠叨会更长。",en:"No fight, but the next lecture will be longer."}}],
  c:"家庭有位真佛，日常有种真道。人能诚心和气，愉色婉言，使父母兄弟间形体两释，意气交流，胜于调息养气万倍。",
  e:"There is a true Buddha in every home and a true Way in daily life. Be sincere and gentle, with a warm face and soft words, so parents and siblings feel at ease and close. That is worth ten thousand times any meditation.",
  m:{zh:"在家里和颜悦色，比任何修行都管用。",en:"A kind face and gentle words at home beat any spiritual practice."},
  u:{zh:"把对客户的耐心，分一半给家人。",en:"Give your family half the patience you give clients."}},
 {q:{zh:"弟弟找家里借钱创业，结果失败了。亲戚们议论纷纷，饭桌上有人当面数落他。",
     en:"Your younger brother borrowed family money for a startup and it failed. Relatives gossip, and at dinner someone criticizes him to his face."},
  o:[{t:{zh:"跟着说他几句，让他长长记性",en:"Join in so he learns his lesson."},g:"low",d:{h:-3,d:-1},
      f:{zh:"他低头扒完饭，之后很久都不回家。",en:"He finished his meal in silence and stayed away for months."}},
     {t:{zh:"饭桌上替他解围，过几天私下陪他复盘",en:"Rescue him at the table, then go over what happened privately a few days later."},g:"up",d:{h:3,d:1},
      f:{zh:"他把复盘写成了一份文档，第二次创业稳了很多。",en:"He turned the review into a document, and his second attempt was far steadier."}},
     {t:{zh:"从此不再借钱给他，少来往",en:"Never lend to him again and keep your distance."},g:"low",d:{h:-2},
      f:{zh:"钱是保住了，兄弟情也冷了。",en:"You kept your money, and lost your brother's warmth."}}],
  c:"家人有过，不宜暴扬，不宜暴弃。此事难言，借他事以隐讽之；今日不悟，俟来日正警之。如春风之解冻，和气之消冰，才是家庭的型范。",
  e:"When family members err, don't broadcast it and don't give up on them. If it's hard to say, hint through other matters; if they don't see it today, try again another day. Like spring wind melting ice: that is the model of a family.",
  m:{zh:"家人犯错不张扬、不放弃，慢慢点拨，像春风化冰。",en:"Don't expose family members' mistakes or abandon them. Guide them gently, like spring thawing ice."},
  u:{zh:"对家人用“私下复盘”，别用“公开问责”。",en:"With family, use private reviews, not public blame."}},
 {q:{zh:"你每月给父母转生活费。某天你忽然想：他们是不是应该更感激我一点？",
     en:"You send your parents money every month. One day you catch yourself thinking: shouldn't they be more grateful?"},
  o:[{t:{zh:"找机会提醒他们，这钱来之不易",en:"Remind them how hard you work for this money."},g:"low",d:{h:-2,d:-1},
      f:{zh:"母亲之后每次收钱都很拘谨，一家人反而生分了。",en:"Your mother now accepts it awkwardly, and the family feels more distant."}},
     {t:{zh:"这是本分，不图感激，继续照常",en:"It's simply your duty. Expect no thanks and carry on."},g:"up",d:{d:2,j:2},
      f:{zh:"放下那个念头后，你给得更轻松，他们收得也更安心。",en:"Once you let go of that thought, giving felt lighter and they accepted it more easily."}},
     {t:{zh:"停一个月，让他们体会一下",en:"Stop for a month so they notice."},g:"low",d:{h:-3,d:-2},
      f:{zh:"他们没说什么，但父亲悄悄退掉了体检预约。",en:"They said nothing, but your father quietly cancelled his health check."}}],
  c:"父慈子孝，兄友弟恭，纵做到极处，俱是合当如是，著不得一毫感激念头。如施者任德，受者怀恩，便是路人，更成市道矣。",
  e:"Kind parents, filial children, friendly siblings: even done perfectly, it is simply as it should be, with no room for expecting thanks. If the giver counts the favor and the receiver feels indebted, they become strangers doing business.",
  m:{zh:"家人之间的付出是本分，一计较感激，就成了买卖。",en:"Giving within a family is duty. Keep score of gratitude and it becomes a transaction."},
  u:{zh:"在公司讲契约，在家里讲情分，两套规则别混用。",en:"Contracts at work, affection at home. Don't mix the two rulebooks."}}],
 quiz:{h:"融得性情上偏私，便是一大学问；",a:"消得家庭内嫌隙，才算一大经纶",w:["赢得职场上名位，才算一大经纶","争得家产中多寡，才算一大本事"],
  e:"Melting away bias in your own temperament is great learning; dissolving rifts in the family is great statesmanship."}}
];

/* ---------- extra situations: scenes 4-5 on every floor ---------- */
const MORE=[
[{q:{zh:"组会上你提出一个新思路，大家纷纷摇头：“以前没这么做过。”可你手上的测试数据明明支持它。",
   en:"In a team meeting you propose a new approach. Everyone shakes their head: 'We've never done it that way.' But your test data clearly supports it."},
  o:[{t:{zh:"既然大家都不看好，就算了",en:"If nobody likes it, drop it."},g:"low",d:{z:-2,j:-1},
      f:{zh:"半年后竞争对手用了同样的思路，抢先上线。",en:"Six months later a competitor launched the very same idea."}},
     {t:{zh:"拍桌坚持：数据摆在这，听我的",en:"Pound the table: the data is right here, do it my way."},g:"mid",d:{z:1,h:-2},
      f:{zh:"你也许是对的，但没人愿意配合一个听不进别人意见的人。",en:"You may be right, but nobody wants to work with someone who won't listen."}},
     {t:{zh:"不放弃，也认真记下大家的顾虑，做个小范围试点再来汇报",en:"Keep the idea, note everyone's concerns, run a small pilot and report back."},g:"up",d:{z:2,h:2,j:1},
      f:{zh:"试点数据一出来，当初反对最凶的人成了最积极的推动者。",en:"Once the pilot data came in, the loudest critic became its biggest champion."}}],
  c:"毋因群疑而阻独见，毋任己意而废人言，毋利小惠而伤大体，毋借公论而快私情。",
  e:"Don't drop your own insight because the crowd doubts it; don't ignore others' views because you trust your own. Don't harm the whole for a small favor; don't use public argument to settle private scores.",
  m:{zh:"不因众人怀疑放弃独到见解，也不因固执己见忽视别人意见。",en:"Don't abandon your insight to the crowd, and don't shut out the crowd for your insight."},
  u:{zh:"有不同意见时，用小试点代替大争论。",en:"When you disagree, run a small pilot instead of having a big argument."}},
 {q:{zh:"淡季来了，项目不多。组里不少人上班刷手机、早早下班，你也有点松懈。",
   en:"Slow season. Few projects. Many teammates scroll their phones and leave early, and you're slacking a bit too."},
  o:[{t:{zh:"难得清闲，跟大家一起放松",en:"Enjoy the rare quiet with everyone else."},g:"low",d:{z:-2,j:1},
      f:{zh:"旺季一来，你手忙脚乱，连基础工具都要重新熟悉。",en:"When the rush came you scrambled, relearning basic tools."}},
     {t:{zh:"趁空把流程文档、自动化脚本和新技能补起来",en:"Use the quiet to fix process docs, build automation and learn a new skill."},g:"up",d:{z:3,j:1},
      f:{zh:"旺季时，你的脚本让全组每天少加两小时班。",en:"In the rush, your scripts saved the whole team two hours of overtime a day."}},
     {t:{zh:"焦虑地到处找活干，搞得自己更累",en:"Anxiously hunt for any work at all and wear yourself out."},g:"mid",d:{z:1,j:-2},
      f:{zh:"你很忙，但忙的大多不是重要的事。",en:"You were busy, mostly on things that didn't matter."}}],
  c:"天地寂然不动，而气机无一息少停；日月昼夜奔驰，而贞明则万古不易。故君子闲时要有吃紧的心思，忙处要有悠闲的趣味。",
  e:"Heaven and earth look still, yet their energy never pauses; sun and moon race day and night, yet their light never changes. So when idle, keep a sense of urgency; when busy, keep a sense of ease.",
  m:{zh:"闲的时候要有紧迫感，忙的时候要有从容心。",en:"Keep urgency in quiet times and ease in busy times."},
  u:{zh:"淡季是为旺季储能的时候。",en:"The slow season is when you store energy for the busy one."}}],

[{q:{zh:"公司两位副总明争暗斗。其中一位私下找你：“跟着我干，帮我收集一下对方团队的‘问题’。”",
   en:"Two vice presidents are locked in a power struggle. One quietly asks you: 'Work with me. Help me collect some \"problems\" on the other side's team.'"},
  o:[{t:{zh:"站队，机会难得",en:"Pick a side. It's a rare opportunity."},g:"low",d:{d:-3,j:-1},
      f:{zh:"一年后这位副总离职，你被贴上了“某某的人”的标签。",en:"A year later that VP left, and you were labeled as 'their person.'"}},
     {t:{zh:"表态只做好本职，对谁的工作需求都一样认真",en:"Say you'll just do your job well and serve both sides' needs equally."},g:"up",d:{d:2,j:2},
      f:{zh:"风波过后，两边的人都信任你。",en:"After the storm passed, both sides trusted you."}},
     {t:{zh:"含糊答应，两边都不得罪",en:"Agree vaguely so you offend no one."},g:"mid",d:{h:1,d:-1,j:-1},
      f:{zh:"含糊的承诺被当成了默认，你越陷越深。",en:"Your vague yes was taken as consent, and you got pulled in deeper."}}],
  c:"公道正论不可犯手，一犯手则贻羞万世；权门私斗不可着脚，一着脚则玷污终身。",
  e:"Never violate what is fair and right; one violation shames you forever. Never step into the private feuds of the powerful; one step stains you for life.",
  m:{zh:"公道不能违背，权力斗争不能掺和。",en:"Don't violate fairness, and don't get involved in power struggles."},
  u:{zh:"做公司的人，不做某个人的人。",en:"Work for the company, not for one person's faction."}},
 {q:{zh:"你发现上月交给客户的报告里有个计算错误，影响不大，目前也没人发现。",
   en:"You discover a calculation error in last month's client report. The impact is small and nobody has noticed."},
  o:[{t:{zh:"悄悄在下个版本里改掉，不声张",en:"Quietly fix it in the next version and say nothing."},g:"mid",d:{d:-1,j:-1},
      f:{zh:"客户后来自己发现了，问你为什么没提。",en:"The client found it later and asked why you hadn't mentioned it."}},
     {t:{zh:"既然没人发现，就当没发生",en:"Nobody noticed, so pretend it never happened."},g:"low",d:{d:-3},
      f:{zh:"错误数据被引用进下一个决策，问题越滚越大。",en:"The wrong figure was used in the next decision, and the problem snowballed."}},
     {t:{zh:"主动告知主管和客户，附上更正版和原因",en:"Tell your manager and the client, with a corrected version and the cause."},g:"up",d:{d:3,h:1},
      f:{zh:"客户说：“敢主动认错的供应商，我们更放心。”",en:"The client said: 'A supplier that owns its mistakes is one we trust more.'"}}],
  c:"恶忌阴，善忌阳。故恶之显者祸浅，而隐者祸深；善之显者功小，而隐者功大。",
  e:"Wrongs are worst when hidden, good deeds weakest when flaunted. An exposed wrong does shallow harm, a hidden one deep harm; a flaunted good earns little merit, a quiet one great merit.",
  m:{zh:"错误藏起来祸患更深，善事藏起来功德更大。",en:"Hidden mistakes do deeper harm; quiet good deeds do greater good."},
  u:{zh:"错误越早公开，代价越小。",en:"The sooner you disclose a mistake, the less it costs."}}],

[{q:{zh:"去年抢过你功劳的同事，现在项目卡住了，跑来请你帮忙。同一周，当初带你入门的前辈也开口请你帮个小忙。",
   en:"The colleague who took credit for your work last year is now stuck and asks for help. The same week, the senior who trained you asks a small favor too."},
  o:[{t:{zh:"前辈的忙马上帮；那位同事也帮，旧账不提",en:"Help your old mentor right away; help the colleague too and don't bring up the past."},g:"up",d:{h:3,j:1},
      f:{zh:"那位同事很意外，此后再没抢过你的功。",en:"The colleague was surprised, and never took your credit again."}},
     {t:{zh:"前辈的帮，同事的不帮：让他也尝尝滋味",en:"Help your mentor, refuse the colleague so they learn how it feels."},g:"low",d:{h:-2,j:-1},
      f:{zh:"出了一口气，但组里多了一对冤家。",en:"It felt good for a moment, and the team gained a feud."}},
     {t:{zh:"都帮，但帮完提醒同事别忘了这次人情",en:"Help both, but remind the colleague afterwards that they owe you."},g:"mid",d:{h:1,d:-1},
      f:{zh:"帮了忙，却把人情变成了账本。",en:"You helped, but turned goodwill into a ledger."}}],
  c:"我有功于人不可念，而过则不可不念；人有恩于我不可忘，而怨则不可不忘。",
  e:"Don't dwell on the good you've done others, but do remember your faults. Never forget the kindness others showed you, but do forget your grudges.",
  m:{zh:"帮过人别记着，错了要记着；受了恩别忘，结了怨要忘。",en:"Forget your favors, remember your faults; remember kindness, forget grudges."},
  u:{zh:"心里只记两本账：别人的恩，自己的过。",en:"Keep only two ledgers: others' kindness and your own mistakes."}},
 {q:{zh:"一家刚接触的合作方，要求你把整个项目的源代码和客户名单先发过去“方便评估”。",
   en:"A partner you've just met asks you to send the full source code and client list first, 'for evaluation.'"},
  o:[{t:{zh:"对方看起来很专业，直接全发",en:"They seem professional. Send everything."},g:"low",d:{d:-1,j:-2},
      f:{zh:"合作没谈成，你的方案却出现在了对方的产品里。",en:"The deal fell through, and your design showed up in their product."}},
     {t:{zh:"真诚交流，按评估所需提供脱敏资料，签保密协议后再深入",en:"Engage sincerely, share anonymized material for evaluation, and go deeper after an NDA."},g:"up",d:{h:2,j:2},
      f:{zh:"对方觉得你专业又靠谱，合作顺利推进。",en:"They found you both professional and trustworthy, and the deal moved forward."}},
     {t:{zh:"认定对方不怀好意，直接拒绝合作",en:"Assume bad intent and refuse to work with them."},g:"mid",d:{h:-2,j:1},
      f:{zh:"安全了，也错过了一个本来不错的伙伴。",en:"Safe, and you missed what would have been a good partner."}}],
  c:"害人之心不可有，防人之心不可无，此戒疏于虞者；宁受人之欺，毋疑人之诈，此警伤于察者。二语并存，精明浑厚矣。",
  e:"Never intend harm, but never drop your guard: a warning against carelessness. Better to be fooled than to presume deceit: a warning against suspicion. Hold both, and you are sharp yet generous.",
  m:{zh:"不害人，也要防人；宁可吃点亏，也不随便猜忌人。",en:"Harm no one, guard yourself, and don't assume the worst."},
  u:{zh:"态度上信任，流程上设防。",en:"Trust in attitude, safeguards in process."}}],

[{q:{zh:"新调来的同事话很少，几乎不表态。某天加班后只剩你们俩，你很想把对主管的不满一吐为快。",
   en:"A newly transferred colleague hardly talks or takes positions. One late night it's just the two of you, and you're itching to vent about your manager."},
  o:[{t:{zh:"一吐为快，反正他话少不会乱说",en:"Let it all out. They're quiet, so they won't gossip."},g:"low",d:{j:-2,d:-1},
      f:{zh:"后来才知道，他是主管的老部下。",en:"You later learned they were your manager's long-time protégé."}},
     {t:{zh:"聊聊工作和生活，不谈对任何人的评价",en:"Chat about work and life, but say nothing about anyone."},g:"up",d:{j:3,h:1},
      f:{zh:"轻松聊了一晚，什么风险都没留下。",en:"A pleasant evening, and no risk left behind."}},
     {t:{zh:"刻意冷淡，防着他",en:"Be deliberately cold and keep them at arm's length."},g:"mid",d:{h:-2},
      f:{zh:"他察觉到了敌意，你们的合作变得别扭。",en:"They felt the hostility, and working together became awkward."}}],
  c:"遇沉沉不语之士，且莫输心；见悻悻自好之人，应须防口。",
  e:"With the silent and unreadable, don't pour out your heart; with the touchy and self-important, guard your tongue.",
  m:{zh:"摸不透的人前别掏心，爱计较的人前要谨言。",en:"Don't confide in people you can't read; watch your words with people who take offense."},
  u:{zh:"抱怨只说给时间验证过的人，最好不说。",en:"Complain only to people time has proven, and preferably not at all."}},
 {q:{zh:"同事第五次请你帮他做 Excel 报表。前几次你都全包了，这次他直接把文件甩过来：“老规矩。”",
   en:"For the fifth time a colleague asks you to do their Excel report. You did all of it before; this time they just toss you the file: 'The usual.'"},
  o:[{t:{zh:"继续全包，同事嘛",en:"Do it all again. That's what colleagues are for."},g:"low",d:{j:-2,z:-1},
      f:{zh:"你成了全组的“免费外包”，自己的活却拖了。",en:"You became the team's free outsourcing, and your own work slipped."}},
     {t:{zh:"这次教他做，把模板和步骤留给他",en:"This time teach them: leave the template and the steps."},g:"up",d:{h:2,j:1,z:1},
      f:{zh:"他学会了，还挺感激你；你的时间也回来了。",en:"They learned it and were grateful, and you got your time back."}},
     {t:{zh:"冷冷回一句“自己做”",en:"Reply coldly: 'Do it yourself.'"},g:"mid",d:{h:-2,j:1},
      f:{zh:"边界有了，关系也僵了。",en:"Boundary set, relationship strained."}}],
  c:"待人而留有余不尽之恩礼，则可以维系无厌之人心；御事而留有余不尽之才智，则可以提防不测之事变。",
  e:"Treat people with kindness that leaves something in reserve, and you can hold even insatiable hearts. Handle affairs with ability held in reserve, and you can guard against the unexpected.",
  m:{zh:"帮人留有余地，做事保留余力。",en:"Help with some left in reserve; work with some ability held back."},
  u:{zh:"授人以渔，别让好意养成别人的依赖。",en:"Teach people to fish. Don't let kindness breed dependence."}}],

[{q:{zh:"曾经风光的明星经理，主导的项目失败了。茶水间里有人开始嘲讽他“早就看他不行”。",
   en:"A once-celebrated manager's project has failed. In the pantry, people start sneering that they 'always knew he wasn't up to it.'"},
  o:[{t:{zh:"跟着附和几句",en:"Chime in."},g:"low",d:{d:-1,h:-1},
      f:{zh:"一年后他东山再起，记得是谁落井下石。",en:"A year later he was back on top, and remembered who had kicked him while down."}},
     {t:{zh:"不附和，说一句：他当初的出发点是对的，问题在执行",en:"Don't join in. Say: his intent was right, the problem was execution."},g:"up",d:{d:2,h:1,j:1},
      f:{zh:"大家安静下来。你也学到了：看人要看初心，也看全程。",en:"The room went quiet. And you learned to judge people by both intent and the whole journey."}},
     {t:{zh:"默默走开，不发表意见",en:"Walk away without a word."},g:"mid",d:{j:1},
      f:{zh:"没错，但也没帮上什么。",en:"Not wrong, but not much help either."}}],
  c:"人至事穷势蹙，当原其初心；士当行满功成，要视其末路。",
  e:"When someone is at the end of their rope, look back at their original intent; when someone is at the height of success, watch how they finish.",
  m:{zh:"看失败的人看初心，看成功的人看结局。",en:"Judge the failing by their intent and the successful by their ending."},
  u:{zh:"别在别人低谷时下结论，也别在别人高峰时下注。",en:"Don't write people off at their lowest, or bet everything on them at their peak."}},
 {q:{zh:"你发现销售提成系统有个漏洞：拆单就能多拿提成，好几个人已经在用了。",
   en:"You find a loophole in the commission system: splitting orders earns extra commission, and several people are already using it."},
  o:[{t:{zh:"别人能用我也用，机会稍纵即逝",en:"If others can use it, so can you. Act fast."},g:"low",d:{d:-3,j:-1},
      f:{zh:"季度审计追溯全部拆单，所有人的提成被扣回，还记了处分。",en:"The quarterly audit traced every split order. Commissions were clawed back and everyone was disciplined."}},
     {t:{zh:"不用，并向财务反馈漏洞",en:"Don't use it, and report the loophole to finance."},g:"up",d:{d:3,j:1},
      f:{zh:"漏洞补上后，你躲过了那次清查。",en:"The loophole was closed, and you were clear when the audit came."}},
     {t:{zh:"不用，但也不管",en:"Don't use it, but don't get involved either."},g:"mid",d:{d:1},
      f:{zh:"你干净，但看着同事一个个踩坑。",en:"You stayed clean, and watched colleagues fall in one by one."}}],
  c:"鱼网之设，鸿则罹其中；螳螂之贪，雀又乘其后。机里藏机，变外生变，智巧何足恃。",
  e:"The net set for fish catches a wild goose; the greedy mantis is stalked by a sparrow. Schemes hide within schemes and changes spawn more changes. How can cleverness be relied on?",
  m:{zh:"算计之外还有算计，小聪明靠不住。",en:"Every scheme has a bigger scheme behind it. Cleverness is unreliable."},
  u:{zh:"看到漏洞先想：这是机会，还是陷阱？",en:"When you see a loophole, ask whether it's an opportunity or a trap."}}],

[{q:{zh:"你当年一手搭建的系统要被新平台替代了。你心里不舍，总在会上为旧系统找理由。",
   en:"The system you built from scratch is being replaced by a new platform. You can't let go, and keep defending the old one in meetings."},
  o:[{t:{zh:"继续反对，能拖就拖",en:"Keep opposing it and stall as long as you can."},g:"low",d:{h:-2,z:-1},
      f:{zh:"迁移延误了三个月，大家开始绕开你开会。",en:"Migration slipped three months, and people started holding meetings without you."}},
     {t:{zh:"放下执念，主动写迁移指南，帮新平台落地",en:"Let go, write the migration guide yourself, and help the new platform land."},g:"up",d:{j:3,h:1,z:1},
      f:{zh:"你成了新平台的负责人之一，旧系统的经验全用上了。",en:"You became one of the new platform's leads, and your old experience all paid off."}},
     {t:{zh:"不反对也不参与，冷眼旁观",en:"Neither oppose nor help. Just watch."},g:"mid",d:{j:-1},
      f:{zh:"项目照样推进，只是没有你。",en:"The project moved on, without you."}}],
  c:"拖泥带水之累，病根在一恋字；随方就圆之妙，便宜在一耐字。",
  e:"Getting bogged down comes from one root: clinging. The art of adapting to any shape has one secret: patience.",
  m:{zh:"做事拖沓是因为放不下，灵活应变靠的是耐心。",en:"Dragging your feet comes from attachment; adapting well comes from patience."},
  u:{zh:"对过去的成果要放得下，对新的变化要耐得住。",en:"Let go of past wins; be patient with new changes."}},
 {q:{zh:"你很关心公司的发展方向，觉得新战略有问题。全员大会开放提问，你想上台“慷慨陈词”。",
   en:"You care about where the company is going and think the new strategy is flawed. The all-hands has an open Q&A, and you want to give a passionate speech."},
  o:[{t:{zh:"上台痛陈问题，越尖锐越好",en:"Take the stage and lay out the problems, the sharper the better."},g:"low",d:{h:-2,j:-2},
      f:{zh:"掌声有，但高层只记住了“这人在拆台”。",en:"Some applause, but leadership only remembered 'this person undermines us.'"}},
     {t:{zh:"会后写一份有数据、有对策的建议书，按渠道递上去",en:"Afterwards, write a proposal with data and solutions, and send it through proper channels."},g:"up",d:{d:2,z:1,j:1},
      f:{zh:"你的建议被采纳了两条，还被拉进了战略小组。",en:"Two of your suggestions were adopted, and you were invited into the strategy group."}},
     {t:{zh:"算了，在朋友圈发几句感慨",en:"Forget it. Post a few sighs on social media."},g:"mid",d:{j:-1},
      f:{zh:"牢骚发了，事情一点没变。",en:"You vented, and nothing changed."}}],
  c:"士君子济人利物，宜居其实，不宜居其名，居其名则德损；士大夫忧国忧民，当有其心，不当有其语，有其语则毁来。",
  e:"When helping others, take the substance, not the name; claiming the name diminishes your virtue. When worrying for the country, have the concern, not the speeches; speeches invite slander.",
  m:{zh:"做好事要实在而不要名声，有忧虑要用行动而不是口号。",en:"Do good for real, not for the name; act on your concerns instead of proclaiming them."},
  u:{zh:"想改变公司，递方案比喊口号有用。",en:"If you want to change the company, a proposal beats a speech."}}],

[{q:{zh:"你对团队要求极高，标准一个比一个严。三个月走了两个人，开会时也没人敢提新想法了。",
   en:"Your standards for the team are extremely high and keep rising. Two people quit in three months, and nobody dares suggest new ideas in meetings anymore."},
  o:[{t:{zh:"走的都是不合格的，继续严",en:"Those who left weren't good enough. Stay strict."},g:"low",d:{h:-3,z:1},
      f:{zh:"又走了一个，剩下的人只做最低限度的工作。",en:"Another one quit, and the rest do the bare minimum."}},
     {t:{zh:"守住关键标准，其他放宽，开会先听大家说",en:"Keep the key standards, relax the rest, and listen first in meetings."},g:"up",d:{h:3,j:1},
      f:{zh:"新点子又冒出来了，团队里笑声也多了。",en:"New ideas started flowing again, and there was more laughter on the team."}},
     {t:{zh:"一下全放开，什么都不管",en:"Drop all the standards at once."},g:"mid",d:{h:1,z:-2},
      f:{zh:"气氛好了，质量却滑坡了。",en:"Morale improved, but quality slid."}}],
  c:"山之高峻处无木，而溪谷回还则草木丛生；水之湍急处无鱼，而渊潭渟蓄则鱼鳖聚集。此高绝之行，偏急之衷，君子重有戒也。",
  e:"Nothing grows on the highest, steepest peaks, while winding valleys are full of trees. No fish live in rushing rapids, while still deep pools teem with them. So the good person is wary of conduct too lofty and a heart too impatient.",
  m:{zh:"太高太急的地方留不住生命，领导者要有容人之量。",en:"Nothing lives where it is too high or too fast. Leaders need room for others."},
  u:{zh:"团队像池塘，水太急就留不住鱼。",en:"A team is like a pond: if the water runs too fast, the fish leave."}},
 {q:{zh:"一位大客户夸大了一个小问题，在电话里对你冷嘲热讽，想借机压价。你一眼看穿了他的用意。",
   en:"A major client blows a small issue out of proportion, mocks you on the phone, and tries to use it to push the price down. You see right through it."},
  o:[{t:{zh:"当场戳穿：“您不就是想压价吗？”",en:"Call it out: 'You just want a lower price, don't you?'"},g:"low",d:{h:-3,j:-1},
      f:{zh:"对方恼羞成怒，直接换了供应商。",en:"Embarrassed and angry, the client switched suppliers."}},
     {t:{zh:"不点破也不动气，平静列出事实和补救方案，价格另谈",en:"Don't expose it, don't get angry. Calmly lay out the facts and a fix; discuss price separately."},g:"up",d:{j:3,h:1},
      f:{zh:"对方找不到发作的理由，价格也没压下去。",en:"The client had nothing to push against, and the price held."}},
     {t:{zh:"被激怒，顶了回去",en:"Get angry and fight back."},g:"low",d:{j:-3},
      f:{zh:"吵赢了一句，丢了一个客户。",en:"You won the argument and lost the client."}}],
  c:"觉人之诈不形于言，受人之侮不动于色。此中有无穷意味，亦有无穷受用。",
  e:"Seeing through a deception, don't say so; enduring an insult, don't show it. There is endless meaning in this, and endless benefit.",
  m:{zh:"看穿不说穿，受辱不动气。",en:"See through it without saying so; take the insult without showing it."},
  u:{zh:"谈判中，情绪是对方最想要的筹码，别给他。",en:"In a negotiation, your emotion is the chip the other side wants most. Don't hand it over."}}],

[{q:{zh:"大学好友准备把全部积蓄投进一个“保本高收益”的项目，还拉你一起。你看了资料，疑点很多。",
   en:"A close friend from university is about to put all their savings into a 'guaranteed high-return' scheme, and wants you in too. The materials look highly suspicious."},
  o:[{t:{zh:"朋友的事少管，委婉说句“你自己决定”",en:"It's their business. Just say 'your call.'"},g:"mid",d:{h:1,d:-1},
      f:{zh:"三个月后项目爆雷，他问你：“你当时为什么不拦我？”",en:"Three months later it collapsed. They asked: 'Why didn't you stop me?'"}},
     {t:{zh:"约他当面谈，把疑点一条条摆出来，坦率劝阻",en:"Meet in person, lay out each red flag, and frankly talk them out of it."},g:"up",d:{h:2,d:2},
      f:{zh:"他犹豫了很久，最后只投了一小笔，保住了大部分积蓄。",en:"They hesitated a long time, then invested only a little and saved most of their money."}},
     {t:{zh:"在同学群里公开说这是骗局",en:"Call it a scam in the class group chat."},g:"low",d:{h:-3},
      f:{zh:"他觉得被当众羞辱，你们好几年没说话。",en:"They felt publicly humiliated, and you didn't speak for years."}}],
  c:"处父兄骨肉之变，宜从容不宜激烈；遇朋友交游之失，宜剀切不宜优游。",
  e:"When trouble arises with parents, siblings or children, be calm, not fierce. When a friend goes wrong, be frank and earnest, not easygoing.",
  m:{zh:"家人出事要从容，朋友犯错要直言。",en:"Be calm with family troubles and frank with friends' mistakes."},
  u:{zh:"真朋友敢当面说难听的话，但不当众说。",en:"A real friend says hard things face to face, but never in front of others."}},
 {q:{zh:"你连续半年应酬喝酒、熬夜加班。伴侣担心你的身体，你却说：“趁年轻多拼拼，老了再养。”",
   en:"For six months you've been drinking at client dinners and working late. Your partner worries about your health; you say: 'Push while you're young, rest when you're old.'"},
  o:[{t:{zh:"继续拼，年轻就是本钱",en:"Keep pushing. Youth is your capital."},g:"low",d:{j:-2,h:-2},
      f:{zh:"体检报告上出现了好几个箭头，家里也开始冷战。",en:"Your health check came back full of warning flags, and a cold war started at home."}},
     {t:{zh:"听进去，定下作息底线，推掉不必要的酒局",en:"Take it to heart: set limits on sleep and skip unnecessary drinking dinners."},g:"up",d:{j:2,h:2,z:1},
      f:{zh:"业绩没掉，人精神了，家里也和气了。",en:"Your numbers held, your energy came back, and home grew warm again."}},
     {t:{zh:"嘴上答应，行动照旧",en:"Agree out loud, change nothing."},g:"mid",d:{h:-1},
      f:{zh:"伴侣不再劝了。这比争吵更让人担心。",en:"Your partner stopped asking. That's more worrying than an argument."}}],
  c:"老来疾病，都是壮时做的；衰时罪孽，都是盛时招的。故持盈履满，君子尤兢焉。",
  e:"The illnesses of old age are made in youth; the troubles of decline are invited at the peak. So when things are full and flourishing, the wise are especially careful.",
  m:{zh:"老年的病是年轻时种下的，衰时的祸是盛时惹下的。",en:"Old-age illness is sown in youth, and late-life trouble is made at the peak."},
  u:{zh:"身体和家庭是长期账户，别透支。",en:"Health and family are long-term accounts. Don't overdraw them."}}]
];
MORE.forEach((a,i)=>CH[i].scenes.push(...a));

/* ---------- state ---------- */
const KEY="cgt-office-quest-v1";
let S={lang:"zh",rec:{},quiz:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.rec)S={...S,...s}}catch(e){}
const H=window.claude?.hot;
if(H?.data?.S)S=H.data.S;
H?.snapshot?.(()=>({S}));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let V={name:"home"}; // current view

const L=o=>o==null?"":(typeof o==="string"?o:(o[S.lang]??o.zh));
const T=k=>L(UI[k]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

function statTotals(){
  const t={z:50,d:50,h:50,j:50};
  for(const key in S.rec){const [c,s]=key.split("-").map(Number);const o=CH[c]?.scenes[s]?.o[S.rec[key]];if(o)for(const k in o.d)t[k]+=o.d[k]}
  for(const c in S.quiz)if(S.quiz[c])t.z+=1,t.j+=1;
  for(const k in t)t[k]=Math.max(0,Math.min(100,t[k]));
  return t;
}
function chDone(c){return S.quiz[c]!==undefined&&CH[c].scenes.every((_,i)=>S.rec[c+"-"+i]!==undefined)}
function unlocked(c){return c===0||chDone(c-1)}
function cardCount(){let n=0;for(const k in S.rec)n++;for(const c in S.quiz)if(S.quiz[c])n++;return n}
function upCount(){let n=0;for(const k in S.rec){const [c,s]=k.split("-").map(Number);if(CH[c].scenes[s].o[S.rec[k]].g==="up")n++}return n}
function sealCount(){return Object.values(S.quiz).filter(Boolean).length}

/* ---------- render ---------- */
function renderStats(delta){
  const t=statTotals();
  $("stats").innerHTML=STATS.map(s=>{
    const dv=delta?.[s.k];
    return `<div class="stat"><div class="stat-top"><span class="stat-name">${esc(L(s))}</span>
      <span class="stat-val">${dv?`<span class="delta ${dv>0?"pos":"neg"}">${dv>0?"+":""}${dv}</span> `:""}${t[s.k]}</span></div>
      <div class="meter"><i style="width:${t[s.k]}%"></i></div></div>`}).join("");
  $("cardCount").textContent=cardCount();
}
function staticText(){
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=T(el.dataset.i));
  document.documentElement.lang=S.lang==="zh"?"zh-CN":"en";
  $("lzh").setAttribute("aria-pressed",S.lang==="zh");$("len").setAttribute("aria-pressed",S.lang==="en");
  document.title=T("appName");
}
function render(){staticText();renderStats(V.delta);const f={home,play,quiz,chend,ending,cards}[V.name];$("view").innerHTML=f();bind()}

function home(){
  const firstOpen=CH.findIndex((_,i)=>unlocked(i)&&!chDone(i));
  const all=firstOpen===-1;
  const floors=[...CH].map((c,i)=>({c,i})).reverse().map(({c,i})=>{
    const st=chDone(i)?"done":unlocked(i)?"open":"lock";
    return `<button class="floor" data-go="${i}" ${st==="lock"?"disabled":""} type="button">
      <span class="floor-no">${c.floor}F</span>
      <span class="floor-body"><span class="floor-title">${esc(L(c.unit))}</span><span class="floor-sub">${esc(L(c.stage))}</span></span>
      <span class="floor-state st-${st}">${T(st)}</span></button>`}).join("");
  const anyProgress=cardCount()>0;
  return `<section class="hero"><div>
    <div class="eyebrow">${T("eyebrow")}</div><h1>${T("h1")}</h1><p class="lede">${T("lede")}</p></div>
    <div class="hero-quote" aria-hidden="true">咬得菜根，则百事可做</div></section>
  <div class="how"><div><b>${T("how1t")}</b>${T("how1")}</div><div><b>${T("how2t")}</b>${T("how2")}</div><div><b>${T("how3t")}</b>${T("how3")}</div></div>
  <div class="home-actions">
    ${all?`<button class="btn primary" data-act="ending" type="button">${T("ending")}</button>`
         :`<button class="btn primary" data-go="${firstOpen}" type="button">${anyProgress?T("cont"):T("start")} · ${CH[firstOpen].floor}F</button>`}
    <button class="btn" data-act="cards" type="button">${T("cardsTitle")}</button>
    ${anyProgress?`<button class="btn ghost" data-act="reset" type="button" id="resetBtn">${T("reset")}</button>`:""}
  </div>
  <div class="section-h"><h2>${T("tower")}</h2><span>${T("towerSub")}</span></div>
  <div class="tower"><div class="roof">乾 坤 大 厦</div>${floors}</div><div class="ground"></div>`;
}

function progressBar(c,cur){
  const n=CH[c].scenes.length+1;
  return `<div class="progress"><span>${CH[c].floor}F · ${esc(L(CH[c].unit))}</span><span class="dots">${
    Array.from({length:n},(_,i)=>`<i class="${i<cur?"on":i===cur?"cur":""}"></i>`).join("")}</span></div>`;
}
function scroll(c,e,m,u){
  return `<div class="scroll"><div class="scroll-tag">${T("bagTag")}</div><div class="scroll-body">
    <p class="classic">${esc(c)}</p>${S.lang==="en"?`<p class="trans">${esc(e)}</p>`:""}
    <dl class="kv"><dt>${T("mean")}</dt><dd>${esc(L(m))}</dd><dt>${T("use")}</dt><dd>${esc(L(u))}</dd></dl></div></div>`;
}
function play(){
  const {c,s}=V;const sc=CH[c].scenes[s];
  if(!V.order)V.order=shuffle([0,1,2]);
  const picked=V.picked;
  const opts=V.order.map((oi,pos)=>{const o=sc.o[oi];
    const cls=picked===undefined?"":(oi===picked?"picked":"dim");
    return `<button class="opt ${cls}" data-pick="${oi}" ${picked!==undefined?"disabled":""} type="button">
      <span class="opt-k">${"ABC"[pos]}</span><span>${esc(L(o.t))}${picked!==undefined?`<span class="opt-g g-${o.g}">${T("g_"+o.g)}</span>`:""}</span></button>`}).join("");
  let after="";
  if(picked!==undefined){
    const o=sc.o[picked];
    const ds=STATS.filter(x=>o.d[x.k]).map(x=>`<span class="delta ${o.d[x.k]>0?"pos":"neg"}">${esc(L(x))} ${o.d[x.k]>0?"+":""}${o.d[x.k]}</span>`).join("");
    const last=s===CH[c].scenes.length-1;
    after=`<div class="feedback">${esc(L(o.f))}<div class="deltas">${ds}</div></div>
      ${scroll(sc.c,sc.e,sc.m,sc.u)}
      <div class="next-row"><button class="btn primary" data-act="next" type="button" id="nextBtn">${last?T("toQuiz"):T("next")}</button></div>`;
  }
  const g=picked!==undefined?sc.o[picked].g:"";
  return `${progressBar(c,s)}
  <article class="memo"><div class="memo-head"><span>${T("memo")} · ${esc(L(CH[c].stage))}</span><span>${T("scene")} ${s+1}/${CH[c].scenes.length}</span></div>
    <p class="memo-q">${esc(L(sc.q))}</p>
    <div class="stamp ${g} ${picked!==undefined?"show":""}" aria-hidden="true">${g?T("g_"+g):""}</div>
    <div class="opts">${opts}</div>${after}</article>`;
}
function quiz(){
  const c=V.c;const q=CH[c].quiz;
  if(!V.order)V.order=shuffle([q.a,...q.w]);
  const ans=V.ans;
  const opts=V.order.map((t,pos)=>{
    const cls=ans===undefined?"":(t===q.a?"picked":(t===ans?"dim":"dim"));
    const tag=ans!==undefined&&t===q.a?`<span class="opt-g g-up">✓</span>`:(ans!==undefined&&t===ans&&t!==q.a?`<span class="opt-g g-low">✗</span>`:"");
    return `<button class="opt ${cls}" data-ans="${esc(t)}" ${ans!==undefined?"disabled":""} type="button"><span class="opt-k">${"ABC"[pos]}</span><span class="qopt">${esc(t)}${tag}</span></button>`}).join("");
  let after="";
  if(ans!==undefined){
    const ok=ans===q.a;
    after=`<div class="feedback">${ok?T("right"):T("wrong")+" "+esc(q.a)}</div>
      <div class="scroll"><div class="scroll-tag">${T("bagTag")}</div><div class="scroll-body"><p class="classic">${esc(q.h+q.a)}</p><p class="trans">${esc(q.e)}</p></div></div>
      <div class="next-row"><button class="btn primary" data-act="finish" type="button" id="nextBtn">${T("finish")}</button></div>`;
  }
  return `${progressBar(c,CH[c].scenes.length)}
  <article class="memo"><div class="memo-head"><span>${T("quizL")}</span><span>${CH[c].floor}F</span></div>
    <p class="memo-q">${T("quizPrompt")}</p>
    <p class="quiz-head">${esc(q.h)}<span class="quiz-blank">${ans!==undefined?esc(q.a):"　？　"}</span></p>
    ${S.lang==="en"?`<p class="trans">${esc(q.e)}</p>`:""}
    <div class="stamp up ${ans===q.a?"show":""}" aria-hidden="true">${CH[c].floor}F</div>
    <div class="opts">${opts}</div>${after}</article>`;
}
function chend(){
  const c=V.c;const ch=CH[c];const last=c===CH.length-1;
  return `<div class="center"><div class="big-seal">${S.quiz[c]?ch.floor+"F":"·"}</div>
    <div class="eyebrow">${T("chDone")}</div><h1>${esc(L(ch.unit))}</h1></div>
    <div class="section-h"><h2>${T("chTake")}</h2></div>
    <div class="summary-list">${ch.scenes.map((sc,i)=>{const o=sc.o[S.rec[c+"-"+i]];
      return `<div><span class="opt-g g-${o.g}">${T("g_"+o.g)}</span><span><span class="classic">${esc(sc.c.split("；")[0].split("。")[0])}</span><br><small>${esc(L(sc.u))}</small></span></div>`}).join("")}</div>
    <div class="home-actions">${last?`<button class="btn primary" data-act="ending" type="button">${T("ending")}</button>`
      :`<button class="btn primary" data-go="${c+1}" type="button">${T("nextFloor")} ${CH[c+1].floor}F</button>`}
      <button class="btn" data-act="home" type="button">${T("backHome")}</button></div>`;
}
function ending(){
  const a=upCount(),b=sealCount(),score=a+b;
  const r=RANKS.find(x=>score>=x.min);
  const t=statTotals();const top=Object.keys(t).sort((x,y)=>t[y]-t[x])[0];
  return `<div class="center"><div class="big-seal">${esc(r.zh.slice(0,2))}</div>
    <div class="eyebrow">${T("endTitle")}</div>
    <div class="rank">${esc(L(r))}</div>
    <p>${T("endScore").replace("{a}",a).replace("{b}",b)}</p>
    <p class="classic">${esc(r.q)}</p>
    <p class="lede" style="margin:8px auto 0">${esc(L(r.t))}</p>
    <p style="margin-top:18px"><small>${T("persona")}</small><br><span class="persona">${esc(L(PERSONA[top]))}</span></p></div>
    <div class="home-actions" style="justify-content:center">
      <button class="btn primary" data-act="cards" type="button">${T("cardsTitle")}</button>
      <button class="btn" data-act="home" type="button">${T("backHome")}</button>
      <button class="btn ghost" data-act="reset" type="button" id="resetBtn">${T("reset")}</button></div>`;
}
function cards(){
  const items=[];
  CH.forEach((ch,c)=>{
    ch.scenes.forEach((sc,s)=>items.push({ok:S.rec[c+"-"+s]!==undefined,f:ch.floor,u:ch.unit,c:sc.c,e:sc.e,use:sc.u}));
    items.push({ok:!!S.quiz[c],f:ch.floor,u:ch.unit,c:ch.quiz.h+ch.quiz.a,e:ch.quiz.e,seal:true});
  });
  return `<div class="section-h"><h2>${T("cardsTitle")}</h2><span>${T("cardsSub").replace("{n}",cardCount())}</span></div>
  <div class="cards">${items.map(it=>it.ok?`<div class="card"><div class="card-top"><span>${it.f}F · ${esc(L(it.u))}</span><span>${it.seal?"印":""}</span></div>
      <p class="classic">${esc(it.c)}</p>${S.lang==="en"?`<p class="trans">${esc(it.e)}</p>`:""}${it.use?`<p class="trans">${esc(L(it.use))}</p>`:""}</div>`
    :`<div class="card locked"><div class="card-top"><span>${it.f}F · ${esc(L(it.u))}</span></div><div class="card-lock">菜</div><small>${T("locked")}</small></div>`).join("")}</div>
  <div class="home-actions"><button class="btn" data-act="home" type="button">${T("backHome")}</button></div>`;
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function go(v){V=v;render();window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"})}

let resetArmed=false;
function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const c=+b.dataset.go;const f=CH[c].scenes.findIndex((_,i)=>S.rec[c+"-"+i]===undefined);go({name:"play",c,s:chDone(c)||f<0?0:f})});
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{
    const oi=+b.dataset.pick;S.rec[V.c+"-"+V.s]=oi;save();V.picked=oi;V.delta=CH[V.c].scenes[V.s].o[oi].d;render();
    $("nextBtn")?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"})});
  document.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{
    const t=b.dataset.ans;V.ans=t;S.quiz[V.c]=t===CH[V.c].quiz.a;save();V.delta=S.quiz[V.c]?{z:1,j:1}:null;render()});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="next"){const last=V.s===CH[V.c].scenes.length-1;go(last?{name:"quiz",c:V.c}:{name:"play",c:V.c,s:V.s+1})}
    else if(a==="finish")go({name:"chend",c:V.c});
    else if(a==="home")go({name:"home"});
    else if(a==="cards")go({name:"cards"});
    else if(a==="ending")go({name:"ending"});
    else if(a==="reset"){
      if(!resetArmed){resetArmed=true;b.textContent=T("resetSure");setTimeout(()=>{resetArmed=false;if(b.isConnected)b.textContent=T("reset")},3000);return}
      resetArmed=false;S={lang:S.lang,rec:{},quiz:{}};save();go({name:"home"})}
  });
}
$("homeBtn").onclick=()=>go({name:"home"});
$("cardsBtn").onclick=()=>go({name:"cards"});
$("lzh").onclick=()=>{S.lang="zh";save();render()};
$("len").onclick=()=>{S.lang="en";save();render()};
const start=()=>render();
H?.ready?H.ready(start):start();
</script>
</body>
